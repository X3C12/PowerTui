name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (hermetic, no root)
        run: python -m unittest discover -p "test_*.py" -v
      - name: Diagnostics smoke
        run: python app.py --diagnostics

  scripts:
    name: Shell + desktop checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck + desktop-file-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck desktop-file-utils
      - name: shellcheck (POSIX sh)
        run: shellcheck -s sh run_tui.sh install.sh uninstall.sh get.sh
      - name: Install into a temp HOME and validate the desktop entry
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          sh install.sh
          test -x "$HOME/.local/bin/powertui"
          test -f "$HOME/.local/share/applications/powertui.desktop"
          desktop-file-validate "$HOME/.local/share/applications/powertui.desktop"
      - name: Uninstall is clean and idempotent
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          sh uninstall.sh
          sh uninstall.sh
          test ! -e "$HOME/.local/bin/powertui"
